name: Test the embedded engine
on:
  push:
    branches: [main, rebuild/local-r2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  miniflare:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bash scripts/build-engine.sh
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-experiment
          path: |
            engine/engine.wasm
            results/*.json
